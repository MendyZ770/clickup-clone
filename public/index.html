<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Done — hors ligne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        background: #a855f7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: white;
        text-align: center;
      }
      .panel {
        max-width: 340px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 34px;
        font-weight: 700;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.92;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: white;
        color: #7c3aed;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="logo" aria-hidden="true">D</div>
      <h1>Connexion impossible</h1>
      <p>
        Done n&rsquo;arrive pas &agrave; joindre le serveur. V&eacute;rifiez votre
        connexion Internet, puis r&eacute;essayez. Vos modifications en attente
        seront synchronis&eacute;es au retour du r&eacute;seau.
      </p>
      <button type="button" onclick="window.location.reload()">R&eacute;essayer</button>
    </main>
  </body>
</html>
